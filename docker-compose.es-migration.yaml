# Temporary ES7 source for an ES7 -> ES9 index copy. Not an app deployment.
# Stop the old stack first (without -v); never mount a volume in two ES instances.
# Start ES9 from docker-compose.yaml before starting this ES7 service.
# See the NOMAD 2.0 migration guide for backups, copying, verification, and cutover:
# https://docs.nomad-lab.eu/develop/howto/oasis/migrate/v2.0.html
#
# export ES7_VOLUME=<actual old Docker volume name>
# export ELASTIC_REINDEX_REMOTE_WHITELIST=elastic_7:9200
# docker compose up -d --no-deps --wait elastic
# docker compose -p nomad-es-migration -f docker-compose.es-migration.yaml up -d --wait
# After verifying the copy, stop ES7 WITHOUT deleting its volume:
# docker compose -p nomad-es-migration -f docker-compose.es-migration.yaml down
# unset ELASTIC_REINDEX_REMOTE_WHITELIST
# docker compose up -d

services:
  elastic_7:
    restart: "no"
    image: ${ES7_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:7.17.28}
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - discovery.type=single-node
      - xpack.security.enabled=false
    volumes:
      - elastic_7:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

volumes:
  elastic_7:
    external: true
    name: ${ES7_VOLUME:?Set ES7_VOLUME to the existing ES7 Docker volume name}

# Join the network created by the main Compose project so ES9 can reach elastic_7.
networks:
  default:
    external: true
    name: ${ES_MIGRATION_NETWORK:-nomad_oasis_network}
