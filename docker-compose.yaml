# ---------------------------------------------------------------------------
# Common Configuration & YAML Anchors
# ---------------------------------------------------------------------------

# Reusable image definitions with environment variable overrides
x-images:
  nomad:      &nomad-image      ${APP_IMAGE:-ghcr.io/fairmat-nfdi/nomad-distro-template:${IMAGE_TAG:-main}}
  jupyter:    &jupyter-image    ${JUPYTER_IMAGE:-ghcr.io/fairmat-nfdi/nomad-distro-template/jupyter:${IMAGE_TAG:-main}}
  cpu-worker: &cpu-worker-image ${NOMAD_CPU_WORKER_IMAGE:-ghcr.io/fairmat-nfdi/nomad-distro-template/cpu-action:${IMAGE_TAG:-main}}
  gpu-worker: &gpu-worker-image ${NOMAD_GPU_WORKER_IMAGE:-ghcr.io/fairmat-nfdi/nomad-distro-template/gpu-action:${IMAGE_TAG:-main}}
  north:      &north-image      ${NOMAD_NORTH_IMAGE:-ghcr.io/fairmat-nfdi/nomad-north:v2.0.0rc1}

  temporal-admin:  &temporal-admin-image  docker.io/temporalio/admin-tools:${TEMPORAL_VERSION:-1.31}
  temporal-server: &temporal-server-image docker.io/temporalio/server:${TEMPORAL_VERSION:-1.31}

# Common environment variables shared across NOMAD app and internal/cpu/gpu workers
x-nomad-environment: &nomad-environment
  NOMAD_ELASTIC_HOST: ${NOMAD_ELASTIC_HOST:-elastic}
  NOMAD_ELASTIC_VERSION: ${NOMAD_ELASTIC_VERSION:-9}
  NOMAD_MONGO_HOST: ${NOMAD_MONGO_HOST:-mongo}
  NOMAD_TEMPORAL_HOST: ${NOMAD_TEMPORAL_HOST:-temporal}

# Base configuration shared across NOMAD app and internal/cpu/gpu workers
x-nomad-base: &nomad-base
  restart: unless-stopped
  platform: linux/amd64
  env_file:
    - ./.env
  depends_on:
    temporal:
      condition: service_healthy
    elastic:
      condition: service_healthy
    mongo:
      condition: service_healthy
  volumes:
    # Uncomment the following line to mount a local nomad.yaml into all NOMAD services:
    # - ./configs/nomad.yaml:/app/nomad.yaml
    - ./.volumes/fs:/app/.volumes/fs

# Base configuration for standard NOMAD services using the default nomad image (app and internal worker)
x-nomad-service: &nomad-service
  <<: *nomad-base
  image: *nomad-image

# Common healthcheck for NOMAD internal/cpu/gpu workers
x-worker-healthcheck: &worker-healthcheck
  test:
    - "CMD"
    - "curl"
    - "--fail"
    - "--silent"
    - "http://localhost:8080/health"
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

# Common database environment variables for Temporal
x-temporal-db-env: &temporal-db-env
  DB: postgres12
  DB_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-temporal}
  POSTGRES_PWD: ${POSTGRES_PASSWORD:-temporal}
  POSTGRES_SEEDS: postgresql

# Base configuration for Temporal admin tools tasks
x-temporal-admin: &temporal-admin
  image: *temporal-admin-image
  volumes:
    - ./scripts/_setup_temporal.sh:/scripts/_setup_temporal.sh
  entrypoint: ["/bin/sh", "/scripts/_setup_temporal.sh"]

services:
  # the search engine
  elastic:
    restart: unless-stopped
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0
    container_name: nomad_oasis_elastic_9
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - discovery.type=single-node
      - xpack.security.enabled=false
    volumes:
      - elastic:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "http://elastic:9200/_cat/health"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  # the user data db
  mongo:
    restart: unless-stopped
    image: docker.io/mongo:8.0
    container_name: nomad_oasis_mongo
    environment:
      - MONGO_DATA_DIR=/data/db
      - MONGO_LOG_DIR=/dev/null
    volumes:
      - mongo:/data/db
      - ./.volumes/mongo:/backup
    command: mongod --logpath=/dev/null # --quiet
    healthcheck:
      test:
        - "CMD"
        - "mongosh"
        - "mongo:27017/test"
        - "--quiet"
        - "--eval"
        - "'db.runCommand({ping:1}).ok'"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s

  # the temporal persistence db
  postgresql:
    restart: unless-stopped
    container_name: nomad_oasis_postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-temporal}
    image: docker.io/postgres:16
    volumes:
      - postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-temporal}"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # one-off job that creates the temporal db schema
  temporal-setup-db:
    <<: *temporal-admin
    container_name: temporal-setup-db
    restart: on-failure:6
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      <<: *temporal-db-env
      SQL_PASSWORD: ${POSTGRES_PASSWORD:-temporal}
    command: ["setup_db"]

  # one-off job that registers the default temporal namespace
  temporal-create-namespace:
    <<: *temporal-admin
    container_name: temporal-create-namespace
    restart: on-failure:5
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: default
    command: ["create_namespace"]

  # the workflow orchestration server
  temporal:
    restart: unless-stopped
    image: *temporal-server-image
    container_name: nomad_oasis_temporal
    depends_on:
      postgresql:
        condition: service_healthy
      temporal-setup-db:
        condition: service_completed_successfully
    environment:
      <<: *temporal-db-env
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./configs/_temporal-sql.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  # nomad worker (processing)
  worker:
    <<: *nomad-service
    environment:
      <<: *nomad-environment
      NOMAD_SERVICE: nomad_oasis_worker
    command: python -m nomad.cli admin run action-internal-worker
    healthcheck: *worker-healthcheck
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: "4.0" # Maximum 4 CPU cores
          memory: 8G # Maximum 8GB RAM

  # nomad gpu worker (actions)
  # gpu_worker:
  #   <<: *nomad-base
  #   image: *gpu-worker-image
  #   container_name: nomad_oasis_gpu_worker
  #   environment:
  #     <<: *nomad-environment
  #     NOMAD_SERVICE: nomad_oasis_gpu_worker
  #   command: python -m nomad.cli admin run action-gpu-worker
  #   healthcheck: *worker-healthcheck
  #   deploy:
  #     replicas: 1
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all # Use all available GPUs
  #             capabilities: [gpu]

  # nomad cpu worker (actions)
  # cpu_worker:
  #   <<: *nomad-base
  #   image: *cpu-worker-image
  #   container_name: nomad_oasis_cpu_worker
  #   environment:
  #     <<: *nomad-environment
  #     NOMAD_SERVICE: nomad_oasis_cpu_worker
  #   command: python -m nomad.cli admin run action-cpu-worker
  #   healthcheck: *worker-healthcheck
  #   deploy:
  #     replicas: 1
  #     resources:
  #       limits:
  #         cpus: "2.0" # Maximum 2 CPU cores
  #         memory: 8G # Maximum 8GB RAM

  # nomad app (api + proxy)
  app:
    <<: *nomad-service
    container_name: nomad_oasis_app
    environment:
      <<: *nomad-environment
      NOMAD_SERVICE: nomad_oasis_app
      NOMAD_SERVICES_API_PORT: 80
      NOMAD_FS_EXTERNAL_WORKING_DIRECTORY: "$PWD"
      NOMAD_NORTH_HUB_HOST: north
    command: python -m nomad.cli admin run app --with-gui --gunicorn --host 0.0.0.0 --workers 2
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "http://localhost:8000/-/health"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s

  # nomad remote tools hub (JupyterHUB)
  north:
    restart: unless-stopped
    image: *north-image
    platform: linux/amd64
    container_name: nomad_oasis_north
    environment:
      NOMAD_API_URL: "http://app:8000/backend/api/v1"
      BASE_URL: "/backend/north/"
      OAUTH_CALLBACK_URL: "http://localhost/backend/north/hub/oauth_callback"
      DOCKER_PREFIX: "nomad-oasis-north"
      DOCKER_NETWORK: "nomad_oasis_network"
    env_file:
      - ./.env.north
    volumes:
      # Bind Docker socket on the host so we can connect to the daemon from
      # within the container
      - "/var/run/docker.sock:/var/run/docker.sock:rw"
      # Bind Docker volume on host for JupyterHub database and cookie secrets
      - "nomad_north:/data"
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "--fail"
        - "--silent"
        - "http://localhost:8081/backend/north/hub/health"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy

  # one-off job for pulling the jupyterlab image
  jupyterlab_image:
    image: *jupyter-image
    platform: linux/amd64
    container_name: nomad_jupyter_image
    pull_policy: always
    entrypoint: ["true"]
    deploy:
      replicas: 0 # Ensures the service isn't started

  # nomad proxy (a reverse proxy for nomad)
  proxy:
    restart: unless-stopped
    image: docker.io/nginx:1.31.1-alpine
    container_name: nomad_oasis_proxy
    command: nginx -g 'daemon off;'
    volumes:
      # Shared config
      - ./configs/nginx_base_conf:/etc/nginx/conf.d/nginx_base_conf:ro
      - ./configs/nginx_maps_conf:/etc/nginx/conf.d/nginx_maps_conf:ro
      # HTTP
      - ./configs/nginx_http.conf:/etc/nginx/conf.d/default.conf:ro
      # HTTPS (you need to have a TLS certificate)
      # - ./configs/nginx_https.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./tls/selfsigned.crt:/etc/nginx/tls/mounted-nomad-oasis.crt:ro  # Path to your TLS certificate
      # - ./tls/selfsigned.key:/etc/nginx/tls/mounted-nomad-oasis.key:ro  # Path to your TLS private key
    depends_on:
      app:
        condition: service_healthy
      worker:
        condition: service_started # TODO: service_healthy
      north:
        condition: service_healthy
    ports:
      - 80:80
      - 443:443

volumes:
  mongo:
    name: "nomad_oasis_mongo"
  elastic:
    name: "nomad_oasis_elastic_9"
  keycloak:
    name: "nomad_oasis_keycloak"
  postgresql:
    name: "nomad_oasis_postgresql"
  nomad_north:
    name: "nomad_oasis_north"


networks:
  default:
    name: nomad_oasis_network
